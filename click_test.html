<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>클릭 테스트</title>
</head>
<body style="padding: 50px;">
    <h1>메인 페이지 링크</h1>
    <p>아래 링크를 클릭하세요. 페이지가 로드된 후 3초 뒤에 자동으로 "사업 관리" 버튼을 클릭합니다.</p>
    
    <a href="/?autoclick=1" target="_blank" style="font-size: 20px; padding: 15px 30px; background: #667eea; color: white; text-decoration: none; border-radius: 5px; display: inline-block;">
        메인 페이지 열기 (자동 클릭 테스트)
    </a>
    
    <hr style="margin: 30px 0;">
    
    <h2>수동 테스트</h2>
    <p>1. 강력 새로고침: Ctrl+Shift+R (Windows) 또는 Cmd+Shift+R (Mac)</p>
    <p>2. F12로 콘솔 열기</p>
    <p>3. 콘솔에 다음 명령어 입력:</p>
    <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px;">
document.getElementById('adminAccessBtn').click();
    </pre>
    
    <p>4. 또는 이 명령어로 함수 직접 호출:</p>
    <pre style="background: #f5f5f5; padding: 15px; border-radius: 5px;">
showAdminAuthModal();
    </pre>
</body>
</html>
