<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로컬 스토리지 초기화</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }
        .clear { background: #dc3545; }
        .reload { background: #28a745; }
        .test { background: #007bff; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <h1>🔧 로컬 스토리지 관리</h1>
    <p>홈페이지의 캐시된 데이터를 관리합니다.</p>
    
    <button class="button clear" onclick="clearStorage()">로컬 스토리지 초기화</button>
    <button class="button reload" onclick="reloadPage()">페이지 새로고침</button>
    <button class="button test" onclick="testData()">데이터 확인</button>
    
    <div class="status" id="status"></div>
    
    <script>
        function clearStorage() {
            localStorage.clear();
            document.getElementById('status').innerHTML = 
                '<h3 style="color: green;">✅ 로컬 스토리지 초기화 완료!</h3>' +
                '<p>이제 메인 페이지로 이동하여 테스트하세요.</p>' +
                '<a href="index.html" style="font-size: 18px;">메인 페이지로 이동</a>';
        }
        
        function reloadPage() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
        
        function testData() {
            fetch('data/projects.json')
                .then(r => r.json())
                .then(projects => {
                    const filesCount = projects.filter(p => p.files && p.files.length > 0).length;
                    document.getElementById('status').innerHTML = 
                        '<h3>📊 데이터 확인</h3>' +
                        '<p><strong>총 프로젝트:</strong> ' + projects.length + '개</p>' +
                        '<p><strong>파일이 있는 프로젝트:</strong> ' + filesCount + '개</p>' +
                        '<p><strong>첫 번째 프로젝트:</strong> ' + projects[0].title + '</p>' +
                        '<p><strong>첫 번째 파일:</strong> ' + 
                        (projects[0].files && projects[0].files.length > 0 ? 
                            projects[0].files[0].name : '없음') + '</p>';
                })
                .catch(err => {
                    document.getElementById('status').innerHTML = 
                        '<h3 style="color: red;">❌ 오류 발생</h3>' +
                        '<p>' + err.message + '</p>';
                });
        }
    </script>
</body>
</html>
