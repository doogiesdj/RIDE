<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐시 초기화 - RIDE</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 캐시 초기화</h1>
        <p>브라우저 캐시를 완전히 초기화합니다.</p>
        
        <button class="btn" onclick="clearAllCache()">캐시 초기화</button>
        <button class="btn" onclick="goToHome()">메인으로 이동</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function clearAllCache() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status';
            
            try {
                // localStorage 초기화
                localStorage.clear();
                
                // sessionStorage 초기화
                sessionStorage.clear();
                
                // 쿠키 삭제
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                
                // Service Worker 제거
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                
                // Cache Storage 초기화
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (let name of names) {
                            caches.delete(name);
                        }
                    });
                }
                
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 캐시가 초기화되었습니다! Ctrl+Shift+R을 눌러 강력 새로고침하세요.';
                
                // 3초 후 메인으로 이동
                setTimeout(() => {
                    window.location.href = '/index.html?' + Date.now();
                }, 3000);
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ 오류: ' + error.message;
            }
        }
        
        function goToHome() {
            window.location.href = '/index.html?' + Date.now();
        }
    </script>
</body>
</html>
